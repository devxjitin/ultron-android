<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Ultron Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body data-state="loading">
  <section id="auth-screen" class="auth" aria-live="polite">
    <div class="auth-card">
      <div class="brand brand-lg"><span class="mark" aria-hidden="true"></span><span>Ultron Control</span></div>
      <div id="auth-signed-out">
        <h1>Sign in</h1>
        <p>Edit the prompts and skills the Ultron app loads, without shipping an app update.</p>
        <button class="btn primary block" id="sign-in">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#fff" d="M21.35 11.1H12v2.98h5.35c-.23 1.4-1.64 4.1-5.35 4.1-3.22 0-5.85-2.67-5.85-5.95S8.78 6.28 12 6.28c1.83 0 3.06.78 3.76 1.45l2.56-2.47C16.68 3.7 14.55 2.8 12 2.8 6.93 2.8 2.8 6.93 2.8 12s4.13 9.2 9.2 9.2c5.31 0 8.83-3.73 8.83-8.99 0-.6-.07-1.06-.15-1.5z"/></svg>
          Continue with Google
        </button>
      </div>
      <div id="auth-denied" hidden>
        <h1>No access</h1>
        <p><strong id="denied-email"></strong> is not allowed to edit Ultron. Sign in with the owner account instead.</p>
        <button class="btn secondary block" id="denied-out">Use another account</button>
      </div>
    </div>
  </section>

  <div id="shell" class="shell">
    <aside id="sidebar" class="sidebar" aria-label="Main">
      <div class="brand"><span class="mark" aria-hidden="true"></span><span>Ultron Control</span></div>
      <nav id="menu" class="menu"></nav>
      <div class="account">
        <div class="avatar" id="avatar" aria-hidden="true"></div>
        <div class="who"><span id="who-email"></span><small>Owner</small></div>
        <button class="icon-btn" id="sign-out" title="Sign out" aria-label="Sign out">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>
    <div class="main">
      <header class="mobilebar">
        <button class="icon-btn" id="menu-toggle" aria-label="Open menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="brand"><span class="mark" aria-hidden="true"></span><span>Ultron Control</span></div>
      </header>
      <main id="content" class="content" tabindex="-1"></main>
    </div>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script src="/__/firebase/10.14.1/firebase-app-compat.js"></script>
  <script src="/__/firebase/10.14.1/firebase-auth-compat.js"></script>
  <script src="/__/firebase/10.14.1/firebase-firestore-compat.js"></script>
  <script src="/__/firebase/init.js"></script>
  <script src="app.js"></script>
</body>
</html>
