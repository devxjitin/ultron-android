AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Read-only yt-dlp MCP attached to the existing Ultron API; downloads remain on Android.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: Independent stack attaches a read-only MCP route to the existing JWT-protected API.
    must: [Never expose downloads, Never modify existing API functions]
# Build mcp/youtube-search/build.py, then cloudformation package and deploy this separate stack.
# ApiId and AuthorizerId come from the existing ultron-api stack. No existing functions are replaced.
Parameters:
  ApiId:
    Type: String
    AllowedPattern: "[a-z0-9]+"
  AuthorizerId:
    Type: String
    AllowedPattern: "[a-z0-9]+"
  FirebaseProjectNumber:
    Type: String
    Default: "434457544612"
  AppCheckMode:
    Type: String
    Default: enforce
    AllowedValues: [enforce, log]
Resources:
  SearchFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Isolate yt-dlp dependencies and deployment from the existing web reader and license APIs.
        must: [App Check required, Media downloads disabled, Bound upstream execution]
    Properties:
      FunctionName: ultron-api-youtube-search
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      CodeUri: ../mcp/youtube-search/function.zip
      Architectures: [x86_64]
      MemorySize: 512
      Timeout: 25
      Environment:
        Variables:
          FIREBASE_PROJECT_NUMBER: !Ref FirebaseProjectNumber
          APP_CHECK_MODE: !Ref AppCheckMode
      Tags:
        project: ultron
  SearchLogs:
    Type: AWS::Logs::LogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Short operational retention for stateless lookup failures.
        must: [Do not log signed upstream URLs]
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SearchFunction}"
      RetentionInDays: 14
  SearchIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Metadata:
      com.aws.cloudformation.Context:
        why: Reuse the current app domain without public Function URLs.
        must: [Keep the integration timeout below the client timeout]
    Properties:
      ApiId: !Ref ApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SearchFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 23000
  SearchRoute:
    Type: AWS::ApiGatewayV2::Route
    Metadata:
      com.aws.cloudformation.Context:
        why: Authenticate callers with the existing Firebase identity provider.
        must: [JWT authorization must remain enabled]
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /v1/youtube/mcp
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      Target: !Sub "integrations/${SearchIntegration}"
  SearchPermission:
    Type: AWS::Lambda::Permission
    Metadata:
      com.aws.cloudformation.Context:
        why: Restrict invocation to this account and API route.
        must: [Keep SourceArn scoped to the YouTube POST route]
    Properties:
      FunctionName: !Ref SearchFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/POST/v1/youtube/mcp"
Outputs:
  McpPath:
    Value: /v1/youtube/mcp
  FunctionName:
    Value: !Ref SearchFunction
