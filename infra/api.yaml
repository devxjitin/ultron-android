AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Ultron API - one HTTP API that checks the caller's Firebase token, in front of the release, web-extract and license Lambdas.
# Deploy without the SAM CLI (build the web-extract zip first):
#   python mcp/web-extract/build.py
#   aws cloudformation package --template-file infra/api.yaml --s3-bucket <bucket> --s3-prefix cfn --output-template-file packaged.yaml
#   aws cloudformation deploy --template-file packaged.yaml --stack-name ultron-api --capabilities CAPABILITY_IAM
# The existing hand-made resources (ultron-updates, web-extract-mcp, the releases bucket) are not touched. The old
# Function URLs keep working until every phone has moved to this API.

Parameters:
  FirebaseProjectId:
    Type: String
    Default: ultron-5350c
    Description: Firebase project whose ID tokens are accepted (issuer and audience).
  ReleasesBucket:
    Type: String
    Default: ultron-app-updates-143920986615
    Description: Existing private bucket that holds latest.json and the APKs.
  DomainName:
    Type: String
    Default: ""
    Description: Custom domain such as api.devxjitin.dev. Leave empty until the certificate is issued.
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate (same region) for DomainName.
  FirebaseProjectNumber:
    Type: String
    Default: "434457544612"
    Description: Numeric Firebase project number (not the id); App Check tokens are checked against it.
  AppCheckMode:
    Type: String
    Default: log
    AllowedValues: [off, log, enforce]
    Description: log records a missing or bad App Check token but lets the request run; enforce refuses it with 401.
  AdminEmails:
    Type: String
    Default: ""
    Description: Comma separated Google emails allowed to use Ultronapp (the activation key admin). Empty locks everyone out.
  AdminOrigins:
    Type: CommaDelimitedList
    Default: "http://localhost:8080"
    Description: Web origins of Ultronapp allowed to call the admin routes, such as https://ultronapp.web.app. No trailing slash.

Conditions:
  HasDomain: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref CertificateArn, ""]]

Globals:
  Function:
    Runtime: python3.12
    Handler: lambda_function.lambda_handler
    Environment:
      Variables:
        JWT_AUTH: "1"
    Tags:
      project: ultron

Resources:
  UltronApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: Ultron API (Firebase JWT)
      Auth:
        DefaultAuthorizer: FirebaseJwt
        Authorizers:
          FirebaseJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://securetoken.google.com/${FirebaseProjectId}"
              audience:
                - !Ref FirebaseProjectId
      # Only Ultronapp (the browser admin app) needs CORS; the phone app is not a browser and ignores it.
      CorsConfiguration:
        AllowOrigins: !Ref AdminOrigins
        AllowMethods: [GET, POST, PATCH, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 20
      # Web reading is the one route anyone with an anonymous account can make expensive; keep it small. Activation is
      # kept slow so nobody can guess keys by trying many of them.
      RouteSettings:
        "POST /v1/web/mcp":
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 3
        "POST /v1/license/activate":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
        "POST /v1/admin/licenses":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
      Tags:
        project: ultron

  # Custom domain, created only once DomainName and CertificateArn are given (SAM cannot make it conditional).
  ApiDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref CertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasDomain
    DependsOn: UltronApiApiGatewayDefaultStage
    Properties:
      DomainName: !Ref ApiDomain
      ApiId: !Ref UltronApi
      Stage: $default

  ReleasesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ultron-api-releases
      CodeUri: ../mcp/ultron-updates/
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          BUCKET: !Ref ReleasesBucket
          FIREBASE_PROJECT_NUMBER: !Ref FirebaseProjectNumber
          APP_CHECK_MODE: !Ref AppCheckMode
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ReleasesBucket
      Events:
        Latest:
          Type: HttpApi
          Properties:
            ApiId: !Ref UltronApi
            Path: /v1/releases/latest
            Method: GET

  ReleasesLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ReleasesFunction}"
      RetentionInDays: 14

  WebExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ultron-api-web-extract
      # Built by mcp/web-extract/build.py with Linux x86_64 wheels.
      CodeUri: ../mcp/web-extract/function.zip
      Architectures: [x86_64]
      MemorySize: 512
      Timeout: 25
      Environment:
        Variables:
          FIREBASE_PROJECT_NUMBER: !Ref FirebaseProjectNumber
          APP_CHECK_MODE: !Ref AppCheckMode
      Events:
        Mcp:
          Type: HttpApi
          Properties:
            ApiId: !Ref UltronApi
            Path: /v1/web/mcp
            Method: POST

  WebExtractLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WebExtractFunction}"
      RetentionInDays: 14

  # One item per activation key sold on the website store (see mcp/license/lambda_function.py for the fields).
  LicensesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: ultron-licenses
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: keyHash
          AttributeType: S
      KeySchema:
        - AttributeName: keyHash
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: project
          Value: ultron

  LicenseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ultron-api-license
      CodeUri: ../mcp/license/
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          TABLE: !Ref LicensesTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt LicensesTable.Arn
      Events:
        Activate:
          Type: HttpApi
          Properties:
            ApiId: !Ref UltronApi
            Path: /v1/license/activate
            Method: POST
        Status:
          Type: HttpApi
          Properties:
            ApiId: !Ref UltronApi
            Path: /v1/license/status
            Method: POST

  LicenseLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LicenseFunction}"
      RetentionInDays: 30

  # Ultronapp's backend: list, create and edit activation keys. Any signed-in Firebase user passes the API's JWT check, so
  # the Lambda itself only lets the verified emails in AdminEmails through.
  LicenseAdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ultron-api-license-admin
      CodeUri: ../mcp/license-admin/
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          TABLE: !Ref LicensesTable
          ADMIN_EMAILS: !Ref AdminEmails
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:Scan, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt LicensesTable.Arn
      Events:
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref UltronApi
            Path: /v1/admin/licenses
            Method: GET
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref UltronApi
            Path: /v1/admin/licenses
            Method: POST
        Update:
          Type: HttpApi
          Properties:
            ApiId: !Ref UltronApi
            Path: /v1/admin/licenses/{id}
            Method: PATCH
        AllowMove:
          Type: HttpApi
          Properties:
            ApiId: !Ref UltronApi
            Path: /v1/admin/licenses/{id}/allow-move
            Method: POST

  LicenseAdminLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LicenseAdminFunction}"
      RetentionInDays: 30

Outputs:
  ApiUrl:
    Value: !Sub "https://${UltronApi}.execute-api.${AWS::Region}.amazonaws.com"
  CustomDomainTarget:
    Condition: HasDomain
    Description: Point the DNS CNAME for DomainName at this value.
    Value: !GetAtt ApiDomain.RegionalDomainName
