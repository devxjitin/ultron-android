name: Publish OTA

on:
  push:
    branches: [main]
    paths:
      - android/**
      - scripts/publish-update.ps1
      - .github/workflows/publish-ota.yml
      - .github/actions/**
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes shown on the phone
        required: false
        default: ""

# Never interrupt an upload halfway through replacing latest.json.
concurrency:
  group: publish-ota
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      current: ${{ steps.latest.outputs.current }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: latest
        name: Skip obsolete commits before installing build tools
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::OTA publishing is allowed only from main."
            exit 1
          fi
          git fetch origin main --quiet
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "::notice::A newer main commit exists; skipping this obsolete release."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      # Same change selection the checks use, so the APK build can start alongside them.
      - id: plan
        run: python scripts/ci_changes.py

  validate:
    needs: preflight
    if: needs.preflight.outputs.current == 'true'
    uses: ./.github/workflows/checks.yml

  # Builds while the checks run; nothing goes live until both have passed.
  build:
    needs: preflight
    if: needs.preflight.outputs.current == 'true' && needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore required signing key and Firebase config
        env:
          DEBUG_KEYSTORE: ${{ secrets.ULTRON_DEBUG_KEYSTORE }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          set -euo pipefail
          test -n "$DEBUG_KEYSTORE" || { echo "ULTRON_DEBUG_KEYSTORE is missing" >&2; exit 1; }
          test -n "$GOOGLE_SERVICES_JSON" || { echo "GOOGLE_SERVICES_JSON is missing" >&2; exit 1; }
          mkdir -p ~/.ultron-android
          printf '%s' "$DEBUG_KEYSTORE" | base64 -d > ~/.ultron-android/debug.keystore
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          printf '%s\n' "$LOCAL_PROPERTIES" > android/local.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/gradle-memory
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1
      - name: Build profiled OTA APK
        shell: pwsh
        env:
          DISPATCH_NOTES: ${{ inputs.notes }}
        run: |
          # Version and notes come from android/app/src/main/assets/changelog.md unless notes are typed for a manual run.
          if ($env:DISPATCH_NOTES) { ./scripts/publish-update.ps1 -Mode Build -Notes $env:DISPATCH_NOTES }
          else { ./scripts/publish-update.ps1 -Mode Build }
      - name: Keep the built APK for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: ota-apk
          path: |
            android/app/build/outputs/apk/ota/app-ota.apk
            android/app/build/outputs/apk/ota/ota-manifest.json
          if-no-files-found: error
          retention-days: 3
      - name: Save OTA timing profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ota-gradle-profile
          path: android/build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [preflight, validate, build]
    if: needs.preflight.outputs.current == 'true' && needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ota-apk
          path: android/app/build/outputs/apk/ota
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1
      - name: Publish verified OTA APK
        shell: pwsh
        run: ./scripts/publish-update.ps1 -Mode Publish
