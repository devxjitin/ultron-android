# Builds the Ultron app and publishes it to the AWS OTA update bucket with scripts/publish-update.ps1.
# Runs on every push to voice-only (docs-only pushes are skipped) and by hand from the Actions tab.
# Secrets: ULTRON_DEBUG_KEYSTORE (base64 of ~/.ultron-android/debug.keystore, the key on installed phones),
# GOOGLE_SERVICES_JSON (base64 of android/app/google-services.json), LOCAL_PROPERTIES (the app's URL/ID lines
# from android/local.properties). Variable: AWS_PUBLISH_ROLE_ARN (role ultron-ota-publish, assumed via OIDC).
name: Publish OTA

on:
  push:
    branches: [voice-only]
    paths-ignore: [track.md, README.md, "docs/**"]
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes shown on the phone
        required: false
        default: ""
      allow_stale:
        description: Publish even if origin/main is not merged into this branch
        type: boolean
        default: false

# Version codes come from the clock, so two publishes must never race.
concurrency:
  group: publish-ota
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # The script checks that origin/main is an ancestor of HEAD.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key and app config
        env:
          DEBUG_KEYSTORE: ${{ secrets.ULTRON_DEBUG_KEYSTORE }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          if [ -z "$DEBUG_KEYSTORE" ]; then echo "ULTRON_DEBUG_KEYSTORE secret is missing" >&2; exit 1; fi
          mkdir -p ~/.ultron-android
          printf '%s' "$DEBUG_KEYSTORE" | base64 -d > ~/.ultron-android/debug.keystore
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json; fi
          printf '%s\n' "$LOCAL_PROPERTIES" > android/local.properties

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build and publish
        shell: pwsh
        env:
          DISPATCH_NOTES: ${{ inputs.notes }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          ALLOW_STALE: ${{ inputs.allow_stale }}
        run: |
          $notes = if ($env:DISPATCH_NOTES) { $env:DISPATCH_NOTES } else { ("$env:COMMIT_MESSAGE" -split "`n")[0] }
          $extra = @{}
          if ($env:ALLOW_STALE -eq "true") { $extra.AllowStale = $true }
          ./scripts/publish-update.ps1 -Notes $notes @extra
