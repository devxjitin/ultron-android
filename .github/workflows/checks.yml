# Runs on every pull request. Nothing here publishes anything; publishing stays in publish-ota.yml (main only).
name: Checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # google-services.json is a secret, so the build runs without it (the app falls back to the on-device key).
      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Lint
        working-directory: android
        run: ./gradlew lintDebug --console=plain

  lambdas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lambda tests
        run: python -m unittest discover -s mcp/tests -v

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Rules and contract tests
        working-directory: rules-tests
        run: |
          npm install
          npm test
